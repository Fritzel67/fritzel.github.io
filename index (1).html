<title>Fritzel ADJAHO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Single dark look, matching the black-and-white portrait: one narrow column, centered */
:root{
  --bg:#0b0b0c; --surface:#151517; --line:#2a2a2e; --fg:#f2f1ee; --muted:#9a9a9f;
  --display:"Fraunces",Georgia,serif; --body:"Outfit",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 40px}
main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px}
.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
header{text-align:center;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:1.5rem;font-weight:500;letter-spacing:.01em;text-wrap:balance}
.bio{margin:0;font-family:var(--display);font-style:italic;font-size:1.15rem;line-height:1.5;color:var(--fg)}
.place{margin:0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav{width:100%;display:flex;flex-direction:column;gap:12px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--fg);text-decoration:none;
  font-weight:500;font-size:1rem;transition:border-color .2s,transform .2s}
nav a span.sub{color:var(--muted);font-weight:400;font-size:.85rem}
nav a .l{display:flex;flex-direction:column;gap:2px}
nav a svg{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.6;transition:stroke .2s,transform .2s}
nav a:hover,nav a:focus-visible{border-color:var(--fg);outline:none}
nav a:hover svg,nav a:focus-visible svg{stroke:var(--fg);transform:translate(2px,-2px)}
footer{color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){nav a,nav a svg{transition:none}}
</style>
</head>
